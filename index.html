<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Mídia & Rádios - V5.5</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: var(--card-bg);
            padding: 1rem 2rem;
            text-align: center;
            border-bottom: 1px solid #334155;
        }
        header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--accent-color);
        }
        main {
            flex: 1;
            padding: 2rem;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }
        .player-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 1.5rem;
        }
        .station-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        button {
            background-color: #334155;
            color: var(--text-color);
            border: 1px solid #475569;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        button:hover {
            background-color: var(--accent-color);
            color: #0f172a;
            border-color: var(--accent-color);
        }
        .active-station {
            background-color: var(--accent-color);
            color: #0f172a;
        }
        .extras-section {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 1.5rem;
        }
        footer {
            text-align: center;
            padding: 1rem;
            background-color: var(--card-bg);
            color: var(--text-muted);
            font-size: 0.875rem;
            border-top: 1px solid #334155;
        }
    </style>
</head>
<body>

    <header>
        <h1>Portal de Mídia & Rádios (v5.5)</h1>
    </header>

    <main>
        <div class="player-container">
            <h2>Player de Transmissão Ativo</h2>
            <p id="current-playing">Selecione uma estação abaixo para iniciar.</p>
            <audio id="audio-player" controls style="width: 100%; margin-top: 1rem;"></audio>
            
            <div class="station-list">
                <button onclick="playStation('Total Hits', 'https://proxy.url/total-hits')">Total Hits (Break Troy)</button>
                <button onclick="playStation('102.3 FM POA', 'https://proxy.url/1023poa')">102.3 FM Porto Alegre</button>
                <button onclick="playStation('Atlântida FM', 'https://proxy.url/atlantida')">Atlântida FM</button>
            </div>

            <div class="extras-section">
                <button onclick="triggerBestLoveSongs()">❤️ Best 80s Love Songs</button>
                <button onclick="initChromecast()">Cast (Chromecast)</button>
            </div>
        </div>
    </main>

    <footer>
        Sistema Otimizado para Alta Compatibilidade &copy; 2026
    </footer>

    <script>
        const audioPlayer = document.getElementById('audio-player');
        const currentPlayingText = document.getElementById('current-playing');

        function playStation(name, streamUrl) {
            currentPlayingText.textContent = `Reproduzindo agora: ${name}`;
            audioPlayer.src = streamUrl;
            audioPlayer.play().catch(e => console.log("Aguardando interação para reprodução automática:", e));
        }

        function triggerBestLoveSongs() {
            alert("Carregando playlist especial: Best 80s Love Songs via YouTube Player.");
        }

        function initChromecast() {
            if ('远程播放' in window || window.RemotePlayback) {
                alert("Procurando dispositivos de reprodução remota e Chromecast compatíveis...");
            } else {
                alert("O recurso de Remote Playback / Chromecast está pronto para conexões seguras HTTPS.");
            }
        }
    </script>
</body>
</html>
