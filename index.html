<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0e1a">
    <title>Portal de Mídia</title>
    <style>
        /* ... (mantenha o mesmo estilo da resposta anterior) ... */
        body { font-family: -apple-system, "Roboto", Arial, sans-serif; background: #0a0e1a; background-image: radial-gradient(ellipse at top left, rgba(99, 102, 241, 0.12) 0%, transparent 50%), radial-gradient(ellipse at bottom right, rgba(236, 72, 153, 0.1) 0%, transparent 50%); background-attachment: fixed; color: #e8ecf4; padding-bottom: 130px; }
        header { padding: 22px 20px 18px; text-align: center; position: sticky; top: 0; z-index: 10; background: rgba(10, 14, 26, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
        header h1 { margin: 0; font-size: 1.3em; font-weight: 700; background: linear-gradient(135deg, #a5b4fc 0%, #f0abfc 50%, #67e8f9 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .section { margin: 18px 14px; padding: 20px 16px; background: linear-gradient(145deg, rgba(30, 41, 59, 0.5) 0%, rgba(15, 23, 42, 0.7) 100%); border: 1px solid rgba(255, 255, 255, 0.07); border-radius: 18px; }
        .section-title { font-size: 0.9em; font-weight: 700; margin: 0 0 16px; display: flex; align-items: center; gap: 12px; color: #f1f5f9; }
        .section-title .icon { display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 11px; font-size: 1em; background: linear-gradient(135deg, rgba(139, 92, 246, 0.25), rgba(236, 72, 153, 0.25)); border: 1px solid rgba(139, 92, 246, 0.3); }
        .radio-grid { display: flex; flex-direction: column; gap: 10px; }
        .radio-btn { display: flex; align-items: center; gap: 14px; width: 100%; padding: 16px; background: linear-gradient(145deg, rgba(51, 65, 85, 0.5), rgba(30, 41, 59, 0.7)); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 15px; color: #f1f5f9; font-size: 1em; font-weight: 600; text-align: left; cursor: pointer; transition: all 0.2s; font-family: inherit; min-height: 70px; position: relative; overflow: hidden; }
        .radio-btn:active { transform: scale(0.98); }
        .radio-btn.playing { background: linear-gradient(145deg, rgba(139, 92, 246, 0.25), rgba(236, 72, 153, 0.15)); border-color: rgba(139, 92, 246, 0.5); }
        .radio-btn.error { border-color: rgba(239, 68, 68, 0.5); background: rgba(127, 29, 29, 0.2); }
        .radio-btn .icon { display: flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 13px; font-size: 1.3em; background: linear-gradient(135deg, rgba(139, 92, 246, 0.3), rgba(236, 72, 153, 0.2)); border: 1px solid rgba(139, 92, 246, 0.3); }
        .radio-btn .label { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .radio-btn .name { font-size: 0.95em; font-weight: 600; }
        .radio-btn small { font-size: 0.7em; color: #94a3b8; font-weight: 500; margin-top: 2px; }
        .radio-btn .status { font-size: 0.65em; color: #64748b; margin-top: 2px; font-style: italic; }
        .mini-player { position: fixed; bottom: 12px; left: 12px; right: 12px; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 14px 16px; z-index: 20; display: none; }
        .mini-player.visible { display: block; }
        .mini-info { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .playing-dot { width: 8px; height: 8px; background: #4ade80; border-radius: 50%; animation: pulse 1.5s infinite; }
        .playing-dot.paused { background: #64748b; animation: none; }
        .mini-title { flex: 1; font-size: 0.85em; color: #e2e8f0; font-weight: 600; }
        .mini-controls { display: flex; align-items: center; gap: 10px; }
        .mini-controls button { background: rgba(51, 65, 85, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); color: #f1f5f9; width: 42px; height: 42px; border-radius: 50%; font-size: 1em; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .volume-wrap { flex: 1; display: flex; align-items: center; gap: 6px; }
        input[type="range"].volume-slider { flex: 1; -webkit-appearance: none; height: 4px; background: rgba(100, 116, 139, 0.4); border-radius: 2px; outline: none; }
        input[type="range"].volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; background: linear-gradient(135deg, #8b5cf6, #ec4899); border-radius: 50%; border: 2px solid #fff; }
        .info-note { font-size: 0.7em; color: #64748b; text-align: center; padding: 12px 0 0; line-height: 1.5; }
    </style>
</head>
<body>
    <header><h1>🎧 Portal de Mídia</h1><p>Rádio • Música • Streaming</p></header>
    <div class="section">
        <h2 class="section-title"><span class="icon">📻</span> Rádio Porto Alegre</h2>
        <div class="radio-grid" id="portoalegre-grid"></div>
    </div>
    <div class="section">
        <h2 class="section-title"><span class="icon">🕺</span> Dance 80 / 90 / 2000</h2>
        <div class="radio-grid" id="dance-grid"></div>
    </div>
    <div class="section">
        <h2 class="section-title"><span class="icon">🌍</span> Estilos & Internacionais</h2>
        <div class="radio-grid" id="intl-grid"></div>
    </div>
    <div class="mini-player" id="mini-player">
        <div class="mini-info"><div class="playing-dot" id="playing-dot"></div><div class="mini-title" id="mini-title">Nada tocando</div></div>
        <div class="mini-controls">
            <button id="btn-play-pause" onclick="togglePlayPause()">▶</button>
            <button class="stop-btn" onclick="stopRadio()">■</button>
            <div class="volume-wrap"><span>🔊</span><input type="range" class="volume-slider" id="volume-slider" min="0" max="100" value="80" oninput="setVolume(this.value)"></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
    <script>
        const PROXY_URL = 'https://corsproxy.io/?'; // Proxy para evitar CORS e Mixed Content
        const API_BASE = 'https://de1.api.radio-browser.info/json';

        const RADIOS_CONFIG = [
            { id: 'atlantida', nome: 'Atlântida', busca: 'Atlantida', regiao: 'Porto Alegre', icon: '⚡', categoria: 'portoalegre' },
            { id: 'antena1', nome: 'Antena 1', busca: 'Antena 1', regiao: 'Nacional', icon: '🎶', categoria: 'portoalegre' },
            { id: 'continental', nome: 'Continental', busca: 'Continental', regiao: 'Porto Alegre', icon: '🎷', categoria: 'portoalegre' },
            { id: 'salamanca', nome: 'Salamanca FM', busca: 'Salamanca', regiao: 'Quaraí/RS', icon: '📻', categoria: 'portoalegre' },
            { id: 'cbn', nome: 'CBN', busca: 'CBN Rio', regiao: 'Nacional', icon: '📰', categoria: 'portoalegre' },
            { id: 'bandnews', nome: 'BandNews', busca: 'BandNews', regiao: 'Nacional', icon: '📡', categoria: 'portoalegre' },
            { id: 'anos80', nome: 'Hits Anos 80', busca: '80s hits', regiao: 'Internacional', icon: '🕺', categoria: 'dance' },
            { id: 'dance90', nome: "Dance 90's", busca: 'Eurodance', regiao: 'Internacional', icon: '🪩', categoria: 'dance' },
            { id: 'dance2000', nome: 'Dance 2000s', busca: 'Dance 2000', regiao: 'Internacional', icon: '🎧', categoria: 'dance' },
            { id: 'rock', nome: 'Classic Rock', busca: 'Classic Rock', regiao: 'Internacional', icon: '🎸', categoria: 'intl' },
            { id: 'pop', nome: 'Pop Hits', busca: 'Pop Hits', regiao: 'Internacional', icon: '🎤', categoria: 'intl' },
            { id: 'lofi', nome: 'Lofi Beats', busca: 'Lofi', regiao: 'Internacional', icon: '☕', categoria: 'intl' },
            { id: 'jazz', nome: 'Jazz', busca: 'Jazz', regiao: 'Internacional', icon: '🎷', categoria: 'intl' },
            { id: 'classical', nome: 'Clássica', busca: 'Classical', regiao: 'Internacional', icon: '🎻', categoria: 'intl' },
            { id: 'paradise', nome: 'Radio Paradise', busca: 'Radio Paradise', regiao: 'Internacional', icon: '🌈', categoria: 'intl' }
        ];

        const streamsCache = {};
        async function buscarRadio(nome) {
            try {
                const url = `${API_BASE}/stations/search?name=${encodeURIComponent(nome)}&limit=5&hidebroken=true&order=votes&reverse=true`;
                const resp = await fetch(url);
                if (!resp.ok) throw new Error('API error');
                const data = await resp.json();
                return data.filter(s => s.url_resolved && s.url_resolved.startsWith('http'));
            } catch (e) { console.log('Erro ao buscar', nome, e); return []; }
        }

        function criarBotao(radio) {
            const btn = document.createElement('button');
            btn.className = 'radio-btn';
            btn.dataset.id = radio.id;
            btn.innerHTML = `<span class="icon">${radio.icon}</span><span class="label"><span class="name">${radio.nome}</span><small>${radio.regiao}</small><span class="status" id="status-${radio.id}">Carregando...</span></span>`;
            btn.onclick = () => playRadio(radio.id, btn);
            return btn;
        }

        function renderizar() {
            const grids = { portoalegre: document.getElementById('portoalegre-grid'), dance: document.getElementById('dance-grid'), intl: document.getElementById('intl-grid') };
            RADIOS_CONFIG.forEach(r => { if (grids[r.categoria]) grids[r.categoria].appendChild(criarBotao(r)); });
        }

        let audio = null, hls = null, currentId = '', volume = 0.8, reqId = 0;

        function cleanup() {
            if (hls) { try { hls.destroy(); } catch(e){} hls = null; }
            if (audio) { try { audio.pause(); audio.removeAttribute('src'); audio.load(); } catch(e){} audio = null; }
        }
        function setStatus(id, text) { const el = document.getElementById('status-' + id); if (el) el.textContent = text; }
        function updateMini(title, paused) {
            const mini = document.getElementById('mini-player'), titleEl = document.getElementById('mini-title'), dot = document.getElementById('playing-dot'), btn = document.getElementById('btn-play-pause');
            if (!currentId) { mini.classList.remove('visible'); return; }
            mini.classList.add('visible'); titleEl.textContent = title;
            if (paused) { dot.classList.add('paused'); btn.textContent = '▶'; } else { dot.classList.remove('paused'); btn.textContent = '❚❚'; }
        }

        async function playRadio(id, btnEl) {
            if (currentId === id && audio && !audio.paused) { togglePlayPause(); return; }
            cleanup(); currentId = id;
            const myReq = ++reqId;
            document.querySelectorAll('.radio-btn').forEach(b => b.classList.remove('playing', 'error'));
            if (btnEl) btnEl.classList.add('playing');
            setStatus(id, 'Conectando...'); updateMini('Conectando...', false);

            const radio = RADIOS_CONFIG.find(r => r.id === id);
            if (!radio) return;
            let streams = streamsCache[id];
            if (!streams) { setStatus(id, 'Buscando estações...'); streams = await buscarRadio(radio.busca); streamsCache[id] = streams; }
            if (myReq !== reqId) return;
            if (!streams || streams.length === 0) { setStatus(id, 'Não encontrada'); if (btnEl) { btnEl.classList.remove('playing'); btnEl.classList.add('error'); } updateMini('Rádio não encontrada', true); return; }

            let idx = 0;
            const tryNext = () => {
                if (myReq !== reqId) return;
                if (idx >= streams.length) { setStatus(id, 'Indisponível'); if (btnEl) { btnEl.classList.remove('playing'); btnEl.classList.add('error'); } updateMini('Indisponível', true); return; }
                const stream = streams[idx];
                const url = PROXY_URL + encodeURIComponent(stream.url_resolved); // Aplica o proxy
                setStatus(id, `Tentando ${idx + 1}/${streams.length}...`);
                if (url.includes('.m3u8')) {
                    if (typeof Hls === 'undefined' || !Hls.isSupported()) { idx++; tryNext(); return; }
                    audio = new Audio(); audio.volume = volume;
                    hls = new Hls({ enableWorker: true }); hls.loadSource(url); hls.attachMedia(audio);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => { if (myReq !== reqId) return; audio.play().then(() => { setStatus(id, '✅ Tocando'); updateMini(radio.nome, false); }).catch(() => { idx++; cleanup(); tryNext(); }); });
                    hls.on(Hls.Events.ERROR, (e, d) => { if (d.fatal && myReq === reqId) { idx++; cleanup(); tryNext(); } });
                    return;
                }
                audio = new Audio(); audio.volume = volume;
                const timeout = setTimeout(() => { if (myReq === reqId && (!audio || audio.paused)) { idx++; cleanup(); tryNext(); } }, 6000);
                audio.addEventListener('playing', () => { clearTimeout(timeout); if (myReq !== reqId) return; setStatus(id, '✅ Tocando'); updateMini(radio.nome, false); }, { once: true });
                audio.addEventListener('error', () => { clearTimeout(timeout); if (myReq !== reqId) return; idx++; cleanup(); tryNext(); }, { once: true });
                audio.src = url; audio.load();
                audio.play().catch(() => { clearTimeout(timeout); idx++; cleanup(); tryNext(); });
            };
            tryNext();
        }

        function togglePlayPause() { if (!audio) return; if (audio.paused) { audio.play(); updateMini(currentId, false); } else { audio.pause(); updateMini(currentId, true); } }
        function stopRadio() { reqId++; cleanup(); currentId = ''; document.querySelectorAll('.radio-btn').forEach(b => b.classList.remove('playing', 'error')); document.getElementById('mini-player').classList.remove('visible'); }
        function setVolume(v) { volume = parseInt(v) / 100; if (audio) audio.volume = volume; try { localStorage.setItem('vol', v); } catch(e){} }

        window.addEventListener('DOMContentLoaded', () => {
            const savedVol = localStorage.getItem('vol') || '80';
            document.getElementById('volume-slider').value = savedVol; volume = parseInt(savedVol) / 100;
            renderizar();
        });
    </script>
</body>
</html>
